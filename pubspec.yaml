name: flutter_app
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.18.2 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # المكتبات بإصدارات متوافقة مع بعضها ومع لغة Dart 2
  intl: ^0.20.2
  firebase_core: ^2.15.0
  firebase_auth: ^4.2.1
  cloud_firestore: ^4.9.1
  flutter_svg: 1.1.6
  intl_phone_field: ^3.1.0
  provider: ^6.0.5
  shared_preferences: ^2.0.15
  flutter_local_notifications: ^14.1.1
  timezone: ^0.9.2
  http: ^0.13.5
  firebase_database: ^10.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/